name: Build OnePlus SukiSU Ultra
on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "CPU分支"
        required: true
        type: choice
        options: [sm8650, sm8550, sm8450, sm8475, sm7675, sm7550, sm6375]
        default: sm8650
      FEIL:
        description: "手机型号"
        required: true
        type: choice
        options: 
          - oneplus_12
          - oneplus_ace3_pro
          - # 其他型号...
        default: oneplus_12
      CPUD:
        description: "处理器代号"
        required: true
        type: choice
        options: [pineapple, kalama, waipio, crow, blair]
        default: pineapple
      ANDROID_VERSION:
        description: "内核安卓版本"
        required: true
        type: choice
        options: [android14, android13, android12]
        default: android14
      KERNEL_VERSION:
        description: "内核版本"
        required: true
        type: choice
        options: [6.1, 5.15, 5.10]
        default: 6.1
      CLANG_VERSION:
        description: "Clang工具链版本"
        type: string
        default: r487747c
      KPM:
        description: "是否启用KPM"
        required: true
        type: choice
        options: [On, Off]
        default: Off
      lz4kd:
        description: "是否启用lz4kd"
        required: true
        type: choice
        options: [On, Off]
        default: Off
      bbr:
        description: "是否启用bbr算法"
        required: true
        type: choice
        options: [On, Off]
        default: Off
      proxy:
        description: "是否添加代理性能优化"
        required: true
        type: choice
        options: [On, Off]
        default: On

jobs:
  build:
    name: Build ${{ inputs.FEIL }} KPM ${{ inputs.KPM }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --ulimit nofile=1024:1024 --kernel-memory 1G
      
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
      
    steps:
      # ====================== 安全审计 ======================
      - name: "📝 Build Audit | 构建审计"
        run: |
          echo "📜 安全审计: 记录构建参数"
          jq -n \
            --arg cpu "${{ inputs.CPU }}" \
            --arg device "${{ inputs.FEIL }}" \
            --arg kver "${{ inputs.KERNEL_VERSION }}" \
            --arg kpm "${{ inputs.KPM }}" \
            '{"CPU":$cpu, "Device":$device, "KernelVersion":$kver, "KPM":$kpm}' > build_audit.json
          cat build_audit.json
          
      # ====================== 系统初始化 ======================
      - name: "🚀 Maximize Build Space | 最大化构建空间"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: true
          remove-android: true
          
      - name: "🔐 Configure Git | 配置Git账户"
        run: |
          git config --global user.name "build-bot"
          git config --global user.email "build@github"
          git config --global protocol.file.allow always
          
      # ====================== 缓存管理 ======================
      - name: "⚙️ Setup Cache Env | 设置缓存环境"
        id: cache_env
        run: |
          RUNNER_ID=$(echo "${{ runner.name }}" | md5sum | cut -c1-8)
          CCACHE_DIR="$HOME/.ccache_${RUNNER_ID}_${{ inputs.FEIL }}"
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
          mkdir -p "$CCACHE_DIR"
          echo "缓存目录: $CCACHE_DIR"
          
      - name: "📦 Restore ccache | 恢复ccache缓存"
        uses: actions/cache@v3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ inputs.FEIL }}-${{ hashFiles('.github/workflows/Build-SukiSU-Ultra.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.FEIL }}-
            
      - name: "⚙️ Initialize ccache | 初始化ccache"
        run: |
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -z
          
      # ====================== 依赖管理 ======================
      - name: "📦 Install Dependencies | 安装构建依赖"
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            build-essential ccache clang flex bison libssl-dev libelf-dev \
            libncurses-dev git curl python3 rsync unzip kmod \
            zlib1g-dev liblz4-tool file jq
          
      # ====================== 源码准备 ======================
      - name: "⬇️ Clone Kernel Source | 克隆内核源码"
        timeout-minutes: 20
        run: |
          mkdir kernel_workspace
          cd kernel_workspace
          repo init -u https://github.com/Xiaomichael/kernel_manifest.git \
            -b refs/heads/oneplus/${{ inputs.CPU }} \
            -m ${{ inputs.FEIL }}.xml \
            --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle --force-sync
          
      # ====================== 补丁安全验证 ======================
      - name: "🔒 Verify Patches | 校验补丁签名"
        if: ${{ secrets.PATCH_SIGNING_KEY }}
        run: |
          echo "导入补丁签名公钥..."
          gpg --batch --import <<< "${{ secrets.PATCH_SIGNING_KEY }}"
          
          echo "验证补丁签名..."
          for patch in patches/*.patch; do
            if [ ! -f "${patch}.sig" ]; then
              echo "❌ 缺少签名文件: ${patch}.sig"
              exit 1
            fi
            gpg --verify "${patch}.sig" "$patch" || exit 1
          done
          echo "✅ 所有补丁验证通过"
          
      # ====================== 内核定制 ======================
      - name: "⚡ Setup SukiSU Ultra | 配置SukiSU Ultra"
        run: |
          cd kernel_workspace/kernel_platform
          
          # 应用补丁（带错误处理）
          apply_patch() {
            local patch_file=$1
            echo "应用补丁: $patch_file"
            
            # 尝试标准应用
            if patch -p1 --forward --reject-file=- < "$patch_file"; then
              echo "✅ 补丁应用成功"
            else
              # 宽松模式重试
              echo "⚠️ 标准模式失败，尝试宽松模式..."
              if patch -p1 --force --no-backup-if-mismatch < "$patch_file"; then
                echo "✅ 宽松模式应用成功"
              else
                echo "❌ 补丁应用失败"
                exit 1
              fi
            fi
          }
          
          # 应用关键补丁
          apply_patch common/50_add_susfs_in_gki-${{ inputs.ANDROID_VERSION }}-${{ inputs.KERNEL_VERSION }}.patch
          apply_patch common/syscall_hooks.patch
          
      # ====================== 内核配置 ======================
      - name: "⚙️ Configure Kernel Options | 配置内核选项"
        run: |
          cd kernel_workspace/kernel_platform/common
          
          # 动态生成自定义版本
          CUSTOM_VERSION="SukiSU-Ultra-${{ inputs.CPU }}-$(date +%Y%m%d)"
          echo "CUSTOM_KERNEL_VERSION=$CUSTOM_VERSION" >> $GITHUB_ENV
          
          # 更新defconfig
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          
          # 条件配置
          if [ "${{ inputs.lz4kd }}" = "On" ]; then
            echo "CONFIG_CRYPTO_LZ4KD=y" >> $DEFCONFIG
          fi
          
          # 移除检查
          sed -i 's/check_defconfig//' ../build.config.gki
          
      # ====================== 编译阶段 ======================
      - name: "🔨 Build Kernel | 编译内核"
        timeout-minutes: 120
        run: |
          cd kernel_workspace/kernel_platform/common
          
          # 设置工具链路径
          export CLANG_PATH="../prebuilts/clang/host/linux-x86/clang-${{ inputs.CLANG_VERSION }}/bin"
          export PATH="$CLANG_PATH:$PATH"
          
          # 设置编译参数
          export ARCH=arm64
          export LLVM=1
          export CC="ccache clang"
          export LD=ld.lld
          
          # 内核版本处理
          BASE_VER=$(make kernelversion)
          FULL_VER="${BASE_VER}-${{ env.CUSTOM_KERNEL_VERSION }}"
          echo "内核版本: $FULL_VER"
          
          # 配置编译环境
          if [ "${{ inputs.KERNEL_VERSION }}" = "6.1" ]; then
            export KBUILD_BUILD_TIMESTAMP="Thu May 29 07:25:40 UTC 2025"
            export KCFLAGS="-O2"
          fi
          
          # 执行编译
          make olddefconfig
          make -j$(($(nproc) * 2)) O=out LOCALVERSION="-${{ env.CUSTOM_KERNEL_VERSION }}" KERNELRELEASE="$FULL_VER"
          
          # 显示缓存统计
          ccache -s
          
      # ====================== 产物处理 ======================
      - name: "🔍 Locate Kernel Image | 定位内核镜像"
        id: locate_image
        run: |
          # 优先检查标准路径
          STANDARD_PATH="kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image"
          if [ -f "$STANDARD_PATH" ]; then
            echo "image_path=$STANDARD_PATH" >> $GITHUB_OUTPUT
            echo "使用标准路径: $STANDARD_PATH"
          else
            # 备用搜索
            FOUND_PATH=$(find kernel_workspace -path '*/arch/arm64/boot/Image' -print -quit)
            if [ -n "$FOUND_PATH" ]; then
              echo "image_path=$FOUND_PATH" >> $GITHUB_OUTPUT
              echo "找到镜像: $FOUND_PATH"
            else
              echo "❌ 错误: 找不到内核镜像"
              exit 1
            fi
          fi
          
      - name: "📦 Package Kernel | 打包内核"
        run: |
          # 创建AnyKernel3目录
          mkdir AnyKernel3
          cp "${{ steps.locate_image.outputs.image_path }}" AnyKernel3/Image
          
          # 生成版本信息
          echo "kernel.version=$FULL_VER" > AnyKernel3/version
          echo "device=${{ inputs.FEIL }}" >> AnyKernel3/version
          
          # 打包
          zip -r9 "SukiSU_${{ inputs.FEIL }}_${{ env.CUSTOM_KERNEL_VERSION }}.zip" AnyKernel3/*
          
      # ====================== 上传结果 ======================
      - name: "📤 Upload Artifact | 上传产物"
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.FEIL }}-${{ env.CUSTOM_KERNEL_VERSION }}
          path: |
            SukiSU_*.zip
            build_audit.json
            
      - name: "📱 Upload to Telegram | 上传到Telegram"
        if: ${{ secrets.BOT_TOKEN && secrets.CHATID }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHATID }}
          token: ${{ secrets.BOT_TOKEN }}
          document: SukiSU_${{ inputs.FEIL }}_${{ env.CUSTOM_KERNEL_VERSION }}.zip
          caption: |
            ✅ 构建成功: ${{ inputs.FEIL }}
            🏷️ 版本: ${{ env.CUSTOM_KERNEL_VERSION }}
            ⚙️ 配置: 
              Android: ${{ inputs.ANDROID_VERSION }}
              Kernel: ${{ inputs.KERNEL_VERSION }}
              KPM: ${{ inputs.KPM }}
